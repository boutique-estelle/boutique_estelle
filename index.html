<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique Estelle - Calavi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f8f8f8}
header{background:#111;color:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
header h1 span{color:#ff3e6c}
.btn-wa{background:#25D366;color:#fff;padding:10px 16px;border-radius:25px;text-decoration:none;font-weight:bold;font-size:14px}
.hero{text-align:center;padding:70px 10%;background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),url('https://images.unsplash.com/photo-1483985988355-763728e1935b?q=80&w=1000');background-size:cover;color:#fff}
.hero h2{font-size:30px;margin-bottom:10px}
.hero a{background:#ff3e6c;color:#fff;padding:12px 25px;border-radius:25px;text-decoration:none;font-weight:bold;display:inline-block;margin-top:15px}
.filters{text-align:center;padding:20px}
.filters button{padding:8px 18px;margin:5px;border:1px solid #ddd;background:#fff;border-radius:20px;cursor:pointer;font-weight:bold}
.filters button.active{background:#111;color:#fff}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px;padding:0 5% 40px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.card img{width:100%;height:210px;object-fit:cover}
.info{padding:12px}
.prix{color:#ff3e6c;font-weight:bold;margin:6px 0}
.cmd{display:block;text-align:center;background:#111;color:#fff;padding:10px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:bold}
footer{background:#111;color:#aaa;text-align:center;padding:20px;font-size:13px}
</style>
</head>
<body>

<header>
  <h1>Boutique<span>Estelle</span></h1>
  <a class="btn-wa" href="https://wa.me/2290197744632?text=Salut%20Estelle%20!%20Je%20veux%20voir%20la%20collection">WhatsApp</a>
</header>

<div class="hero">
  <h2>Nouvelle Collection 2026</h2>
  <p>Livraison Calavi - Cotonou en 24h - Paiement Mobile Money</p>
  <a href="#shop">Voir les habits</a>
</div>

<div class="filters" id="shop">
  <button class="active" onclick="filterCat('all',this)">Tout</button>
  <button onclick="filterCat('femme',this)">Femme</button>
  <button onclick="filterCat('homme',this)">Homme</button>
  <button onclick="filterCat('enfant',this)">Enfant</button>
</div>

<div class="products">
  <div class="card femme"><img src="images/robe-rouge.jpg"><div class="info"><h3>Robe Rouge</h3><p class="prix">12.000 FCFA</p
